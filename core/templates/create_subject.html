{% extends "base.html" %}
{% block title %}New Subject — TaskFlow{% endblock %}

{% block extra_head %}
<style>
  .create-wrap {
    min-height: calc(100vh - 3.75rem);
    display: flex;
    align-items: flex-start;
    padding: 3rem 1.5rem 4rem;
  }

  .create-card {
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
  }

  .create-hero {
    text-align: center;
    margin-bottom: 2rem;
  }

  .create-hero-icon {
    width: 3.5rem;
    height: 3.5rem;
    border-radius: var(--r-xl);
    background: linear-gradient(135deg, var(--indigo-500), var(--violet-500));
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.125rem;
    box-shadow: 0 4px 18px var(--primary-glow);
  }

  .create-hero h1 {
    font-size: 1.625rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--fg);
    margin-bottom: 0.375rem;
  }

  .create-hero p {
    font-size: 0.9rem;
    color: var(--fg-muted);
  }

  .form-surface {
    background: var(--surface);
    border: 1px solid var(--border-2);
    border-radius: var(--r-2xl);
    box-shadow: var(--sh-lg);
    padding: 2rem;
    position: relative;
    overflow: hidden;
  }

  .form-surface::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--indigo-500), var(--violet-500));
    border-radius: var(--r-2xl) var(--r-2xl) 0 0;
  }

  .input-group {
    margin-bottom: 1rem;
  }

  .form-input-lg {
    width: 100%;
    padding: 0.875rem 1rem;
    border: 1.5px solid var(--border);
    border-radius: var(--r-lg);
    background: var(--bg-subtle);
    color: var(--fg);
    font-size: 1rem;
    font-weight: 600;
    outline: none;
  }

  .form-input-lg:focus {
    border-color: var(--primary);
    background: var(--surface);
  }

  /* ================= COLOR PICKER ================= */
  .color-picker {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1rem;
    padding: 0.9rem;
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    background: var(--bg-subtle);
  }

  .color-preview {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .color-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #6366f1;
    box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
  }

  .color-label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--fg-muted);
  }

  .color-picker input[type="color"] {
    width: 45px;
    height: 35px;
    border: none;
    background: transparent;
    cursor: pointer;
  }

  .btn-create {
    width: 100%;
    padding: 0.875rem;
    border-radius: var(--r-lg);
    font-size: 1rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--indigo-500), var(--violet-500));
    color: #fff;
    border: none;
    cursor: pointer;
    margin-top: 1.25rem;
  }

  .btn-cancel {
    width: 100%;
    padding: 0.75rem;
    border-radius: var(--r-lg);
    font-size: 0.9375rem;
    font-weight: 600;
    background: transparent;
    color: var(--fg-muted);
    border: 1.5px solid var(--border);
    display: block;
    margin-top: 0.75rem;
    text-align: center;
  }

</style>
{% endblock %}

{% block content %}
<div class="create-wrap">
  <div class="create-card">

    <a href="{% url 'dashboard' %}" class="back-link">← Back</a>

    <div class="create-hero">
      <div class="create-hero-icon">📘</div>
      <h1>Create a Subject</h1>
      <p>Give your workspace a name and color</p>
    </div>

    <div class="form-surface">
      <form method="post">
        {% csrf_token %}

        <div class="input-group">
          <input type="text"
                 name="name"
                 placeholder="Subject name..."
                 class="form-input-lg"
                 maxlength="80"
                 required>
        </div>

        <!-- COLOR -->
        <div class="color-picker">
          <div class="color-preview">
            <div class="color-dot" id="colorDot"></div>
            <span class="color-label">Choose color</span>
          </div>

          <input type="color"
                 name="color"
                 id="colorInput"
                 value="#6366f1">
        </div>

        <button type="submit" class="btn-create">
          Create Subject
        </button>

        <a href="{% url 'dashboard' %}" class="btn-cancel">Cancel</a>
      </form>
    </div>

  </div>
</div>

<script>
  const colorInput = document.getElementById("colorInput");
  const colorDot = document.getElementById("colorDot");

  colorInput.addEventListener("input", function () {
    colorDot.style.background = this.value;
    colorDot.style.boxShadow = `0 0 0 3px ${this.value}33`;
  });
</script>
{% endblock %}
