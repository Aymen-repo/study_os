{% extends "base.html" %}
{% block title %}Edit Profile — TaskFlow{% endblock %}

{% block content %}
<div class="container-sm">

  <div class="page-header">
    <div>
      <h1 class="page-title">Edit Profile</h1>
      <p class="page-subtitle">Update your personal information</p>
    </div>
  </div>

  <div class="surface" style="padding:2rem;">

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <!-- Bio -->
      <div class="form-group">
        <label class="form-label">Bio</label>
        <textarea name="bio" class="form-input" rows="4">{{ profile.bio }}</textarea>
      </div>

      <!-- Image -->
      <div class="form-group" style="margin-top:1rem;">
        <label class="form-label">Profile Image</label>
        <input type="file" name="profile_image" class="form-input">
      </div>

      <button type="submit" class="btn btn-primary btn-full" style="margin-top:1.5rem;">
        Save Changes
      </button>

      <a href="{% url 'profile' %}" class="btn btn-ghost btn-full" style="margin-top:0.75rem;">
        Cancel
      </a>

    </form>

  </div>

</div>
{% endblock %}
