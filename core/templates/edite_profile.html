{% extends "base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block extra_head %}
<style>

.edit-container {
  max-width: 700px;
  margin: 2rem auto;
  padding: 1rem;
}

.edit-card {
  background: var(--surface);
  padding: 2rem;
  border-radius: 16px;
  box-shadow: var(--sh-lg);
}

h1 {
  margin-bottom: 0.3rem;
}

.subtitle {
  color: gray;
  margin-bottom: 1.5rem;
}

/* form */
.form-group {
  margin-bottom: 1rem;
}

label {
  display: block;
  font-weight: 600;
  margin-bottom: 0.3rem;
}

input, textarea {
  width: 100%;
  padding: 0.7rem;
  border-radius: 10px;
  border: 1px solid var(--border);
}

/* buttons */
.btn {
  width: 100%;
  padding: 0.8rem;
  border: none;
  border-radius: 10px;
  background: #6c63ff;
  color: white;
  font-weight: 600;
  cursor: pointer;
  margin-top: 1rem;
}

.btn:hover {
  opacity: 0.9;
}

.cancel {
  text-align: center;
  display: block;
  margin-top: 0.7rem;
  color: gray;
  text-decoration: none;
}

</style>
{% endblock %}

{% block content %}

<div class="edit-container">
  <div class="edit-card">

    <h1>Edit Profile</h1>
    <p class="subtitle">Update your personal information</p>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <!-- USERNAME -->
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" value="{{ user.username }}">
      </div>

      <!-- EMAIL -->
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" value="{{ user.email }}">
      </div>

      <!-- BIO -->
      <div class="form-group">
        <label>Bio</label>
        <textarea name="bio">{{ profile.bio }}</textarea>
      </div>

      <!-- IMAGE -->
      <div class="form-group">
        <label>Profile Image</label>
        <input type="file" name="avatar">
      </div>

      <button class="btn" type="submit">Save Changes</button>

      <a href="{% url 'profile' %}" class="cancel">Cancel</a>

    </form>

  </div>
</div>

{% endblock %}
